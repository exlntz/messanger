name: iOS unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'project.yml'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Select Xcode 26
        run: bash scripts/select_xcode26.sh
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen >brew.log 2>&1 || { tail -30 brew.log; exit 1; }
          fi
          xcodegen --version
      - name: Generate app icon and Xcode project
        run: |
          set -euo pipefail
          python3 scripts/generate_app_icon.py
          xcodegen generate --spec project.yml
      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project VOICE.xcodeproj -scheme VOICE \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages >packages.log 2>&1 || { tail -60 packages.log; exit 1; }
      - name: Build Release for iPhoneOS
        run: |
          set +e
          set -uo pipefail
          xcodebuild -quiet -project VOICE.xcodeproj -scheme VOICE -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build >build.log 2>&1
          status=$?
          python3 scripts/report_build_errors.py build.log
          if [ "$status" -ne 0 ]; then tail -60 build.log; fi
          exit "$status"
      - name: Package unsigned IPA
        run: bash scripts/package_unsigned_ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VOICE-unsigned-ipa
          path: VOICE-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            build.log
            packages.log
            xcode-version.txt
            executable-file.txt
            executable-arch.txt
            VOICE.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            DerivedData/Logs/**
          if-no-files-found: ignore
          retention-days: 14
