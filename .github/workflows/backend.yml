name: Backend Security

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  supabase-security:
    name: Supabase SQL security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap local backend test database
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -a -f supabase/tests/bootstrap_local.sql

      - name: Apply base backend migration
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -a -f supabase/migrations/202609260001_voice_backend.sql

      - name: Apply backend hardening migration
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -a -f supabase/migrations/202609260002_voice_backend_hardening.sql

      - name: Run SQL security tests with psql
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -a -f supabase/tests/voice_security.sql
