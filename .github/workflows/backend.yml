name: Backend Security

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  supabase-security:
    name: Supabase SQL security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install psql client
        run: |
          sudo apt-get update -qq >/tmp/apt.log 2>&1
          sudo apt-get install -y -qq postgresql-client >>/tmp/apt.log 2>&1

      - name: Run backend SQL security tests
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          run_sql() {
            local label="$1"
            local file="$2"
            local log="/tmp/${label//[^A-Za-z0-9_-]/_}.log"
            echo "== ${label} =="
            if ! psql "$DB_URL" -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f "$file" >"$log" 2>&1; then
              local summary
              summary=$(grep -E "ERROR:|EXCEPTION|SQLSTATE|expected|psql:" "$log" | tail -1 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error title=${label} failed::${summary:-SQL command failed}"
              echo "---- ${label} failure tail ----"
              tail -80 "$log"
              exit 1
            fi
          }

          run_sql "bootstrap-local" "supabase/tests/bootstrap_local.sql"
          run_sql "base-migration" "supabase/migrations/202609260001_voice_backend.sql"
          run_sql "hardening-migration" "supabase/migrations/202609260002_voice_backend_hardening.sql"
          run_sql "voice-security" "supabase/tests/voice_security.sql"
          echo "Backend SQL security tests passed"
